<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>報名管理｜青少年攀岩系列賽</title>
<link rel="stylesheet" href="styles.css">
<style>
  .wrap { max-width: 1200px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  .toolbar select, .toolbar input { width: auto; font-size: 14px; padding: 7px 10px; }
  .stat-num { font-size: 26px; font-weight: 800; }
  td select { width: auto; font-size: 13px; padding: 4px 6px; }
  .cnt { text-align: center; }
</style>
</head>
<body>
<header class="site"><div class="wrap"><a class="logo" href="index.html">🧗 <span>報名</span>管理</a><nav><button class="btn ghost sm hidden" id="logout">登出</button></nav></div></header>
<main class="wrap" style="padding-top:24px">
  <form id="login" class="card" style="max-width:380px">
    <h3>管理員登入</h3>
    <div class="field"><label class="lbl" for="pw">密碼</label><input type="password" id="pw" required></div>
    <button class="btn" type="submit">登入</button>
    <div id="loginErr" class="alert err hidden"></div>
  </form>

  <div id="app" class="hidden">
    <div class="grid c4" id="kpis"></div>

    <section>
      <h2>各場各組人數 <span class="small muted" style="font-weight:400">（不含已取消；男/女）</span></h2>
      <div class="table-scroll"><table id="statTable"></table></div>
      <p class="small muted" id="splitHint"></p>
    </section>

    <section>
      <h2>報名名單</h2>
      <div class="toolbar">
        <select id="fEvent"><option value="">全部場次</option></select>
        <select id="fDiv"><option value="">全部組別</option></select>
        <select id="fStatus"><option value="">全部狀態</option><option value="pending">待繳費</option><option value="paid">已繳費</option><option value="cancelled">已取消</option></select>
        <input type="text" id="fText" placeholder="搜尋姓名／編號／手機">
        <button class="btn ghost sm" id="reload">重新整理</button>
        <button class="btn sm" id="csv">匯出 CSV</button>
      </div>
      <div class="table-scroll"><table id="list"></table></div>
    </section>
  </div>
</main>
<script type="module">
  import { loadConfig, fmt, esc, STATUS } from "./common.js";
  const c = await loadConfig();
  const $ = (id) => document.getElementById(id);
  let pw = "", regs = [];
  try { pw = sessionStorage.getItem("adminpw") || ""; } catch {}
  const evName = Object.fromEntries(c.events.map(e => [e.id, e.name]));
  const divById = Object.fromEntries(c.divisions.map(d => [d.id, d]));
  const gradeLabel = Object.fromEntries(c.grades.map(g => [g.id, g.label]));
  $("fEvent").innerHTML += c.events.map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join("");
  $("fDiv").innerHTML += c.divisions.map(d => `<option value="${d.id}">${esc(d.label)}</option>`).join("");

  async function api(method, body) {
    const res = await fetch("/api/admin", { method, headers: { "x-admin-password": pw, "content-type": "application/json" }, body: body && JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw Object.assign(new Error(data.error), { status: res.status });
    return data;
  }

  async function load() {
    try {
      regs = (await api("GET")).registrations;
      $("login").classList.add("hidden"); $("app").classList.remove("hidden"); $("logout").classList.remove("hidden");
      render();
    } catch (e) {
      $("login").classList.remove("hidden"); $("app").classList.add("hidden");
      if (pw) { $("loginErr").textContent = e.message; $("loginErr").classList.remove("hidden"); }
    }
  }

  function render() {
    const active = regs.filter(r => r.status !== "cancelled");
    const paid = regs.filter(r => r.status === "paid");
    const pend = regs.filter(r => r.status === "pending");
    const athletes = new Set(active.map(r => r.athlete.name + r.athlete.birthday)).size;
    $("kpis").innerHTML = [
      ["有效報名", active.length + " 筆", `${athletes} 位選手`],
      ["已繳費", fmt(paid.reduce((s, r) => s + r.amount, 0)), paid.length + " 筆"],
      ["待繳費", fmt(pend.reduce((s, r) => s + r.amount, 0)), pend.length + " 筆（" + pend.filter(r => r.transferLast5).length + " 筆已回報）"],
      ["四場套票", active.filter(r => r.events.length === c.events.length).length + " 筆", ""],
    ].map(([t, v, s]) => `<div class="card"><div class="small muted">${t}</div><div class="stat-num">${v}</div><div class="small muted">${s}</div></div>`).join("");

    // 人數統計
    let splitFlags = 0;
    const head = `<thead><tr><th>組別</th>${c.events.map(e => `<th class="cnt">${esc(e.name)}</th>`).join("")}</tr></thead>`;
    const rows = c.divisions.map(d => {
      const cells = c.events.map(e => {
        const list = active.filter(r => r.division === d.id && r.events.includes(e.id));
        const m = list.filter(r => r.athlete.gender === "M").length, f = list.length - m;
        const split = d.splitByGender && (m > c.genderSplitThreshold || f > c.genderSplitThreshold);
        if (split) splitFlags++;
        return `<td class="cnt"><b>${list.length}</b> <span class="small muted">(${m}/${f})</span>${split ? '<br><span class="badge split">需拆男女組</span>' : ""}</td>`;
      }).join("");
      return `<tr><td><b>${esc(d.label)}</b></td>${cells}</tr>`;
    }).join("");
    const totals = `<tr><td><b>合計</b></td>${c.events.map(e => `<td class="cnt"><b>${active.filter(r => r.events.includes(e.id)).length}</b></td>`).join("")}</tr>`;
    $("statTable").innerHTML = head + "<tbody>" + rows + totals + "</tbody>";
    $("splitHint").textContent = splitFlags ? `⚠️ 有 ${splitFlags} 個場次組別單一性別超過 ${c.genderSplitThreshold} 人，需拆男女組。` : `單一性別超過 ${c.genderSplitThreshold} 人時會標示「需拆男女組」。`;

    // 名單
    const list = filtered();
    $("list").innerHTML = `<thead><tr><th>編號</th><th>選手</th><th>組別</th><th>場次</th><th>金額</th><th>監護人</th><th>末五碼</th><th>狀態</th><th>報名時間</th></tr></thead><tbody>` +
      (list.length ? list.map(r => `<tr>
        <td><b>${esc(r.code)}</b></td>
        <td>${esc(r.athlete.name)}　${r.athlete.gender === "M" ? "男" : "女"}<br><span class="small muted">${esc(gradeLabel[r.athlete.grade])}・${esc(r.athlete.school)}${r.athlete.team ? "・" + esc(r.athlete.team) : ""}</span>${r.note ? `<br><span class="small">📝 ${esc(r.note)}</span>` : ""}</td>
        <td class="small">${esc(divById[r.division]?.label)}</td>
        <td class="small">${r.events.map(id => esc(evName[id])).join("<br>")}</td>
        <td>${fmt(r.amount)}</td>
        <td class="small">${esc(r.guardian.name)}<br>${esc(r.guardian.phone)}<br>${esc(r.guardian.email)}</td>
        <td>${esc(r.transferLast5 || "—")}</td>
        <td><select data-code="${esc(r.code)}">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === r.status ? "selected" : ""}>${v}</option>`).join("")}</select></td>
        <td class="small muted">${new Date(r.createdAt).toLocaleString("zh-TW", { hour12: false })}</td>
      </tr>`).join("") : `<tr><td colspan="9" class="muted">沒有資料</td></tr>`) + "</tbody>";
  }

  function filtered() {
    const ev = $("fEvent").value, dv = $("fDiv").value, st = $("fStatus").value, t = $("fText").value.trim().toUpperCase();
    return regs.filter(r => (!ev || r.events.includes(ev)) && (!dv || r.division === dv) && (!st || r.status === st) &&
      (!t || r.code.includes(t) || r.athlete.name.toUpperCase().includes(t) || r.guardian.phone.includes(t))).reverse();
  }

  $("list").addEventListener("change", async (e) => {
    const sel = e.target.closest("select[data-code]");
    if (!sel) return;
    try {
      const { registration } = await api("POST", { code: sel.dataset.code, status: sel.value });
      regs = regs.map(r => r.code === registration.code ? registration : r);
      render();
    } catch (er) { alert(er.message); load(); }
  });
  ["fEvent", "fDiv", "fStatus"].forEach(id => $(id).addEventListener("change", render));
  $("fText").addEventListener("input", render);
  $("reload").onclick = load;
  $("login").addEventListener("submit", (e) => { e.preventDefault(); pw = $("pw").value; try { sessionStorage.setItem("adminpw", pw); } catch {} load(); });
  $("logout").onclick = () => { try { sessionStorage.removeItem("adminpw"); } catch {} location.reload(); };

  $("csv").onclick = () => {
    const cols = ["報名編號", "報名時間", "狀態", "選手姓名", "性別", "生日", "年級", "學校", "隊伍/教練", "組別", ...c.events.map(e => e.name), "金額", "匯款末五碼", "監護人", "監護人手機", "Email", "緊急聯絡人", "緊急聯絡電話", "備註"];
    const rows = filtered().map(r => [r.code, new Date(r.createdAt).toLocaleString("zh-TW", { hour12: false }), STATUS[r.status], r.athlete.name, r.athlete.gender === "M" ? "男" : "女", r.athlete.birthday, gradeLabel[r.athlete.grade], r.athlete.school, r.athlete.team, divById[r.division]?.label,
      ...c.events.map(e => r.events.includes(e.id) ? "V" : ""), r.amount, r.transferLast5, r.guardian.name, r.guardian.phone, r.guardian.email, r.guardian.emergencyName, r.guardian.emergencyPhone, r.note]);
    const csv = [cols, ...rows].map(row => row.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
    a.download = `報名名單_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
  };

  if (pw) load();
</script>
</body>
</html>
